<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 方案 C：光子凭证 & 闪电 (The Quantum Receipt & Bolt) -->
  <defs>
    <linearGradient id="bgC2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38"/>
      <stop offset="50%" stop-color="#0A1324"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ticketC2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="boltC2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadowC2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="124" fill="url(#bgC2)"/>
  <rect width="510" height="510" x="1" y="1" rx="123" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="2"/>

  <!-- 票据主体 (带优雅波浪齿与条形码) -->
  <g transform="translate(146, 100)">
    <!-- 票据背景 -->
    <path d="M 0 24 
             C 0 10, 10 0, 24 0 
             L 196 0 
             C 210 0, 220 10, 220 24 
             L 220 286 
             L 198 274 L 176 286 L 154 274 L 132 286 L 110 274 L 88 286 L 66 274 L 44 286 L 22 274 L 0 286 Z" 
          fill="url(#ticketC2)"/>
    
    <!-- 票据顶部打孔/挂孔 -->
    <circle cx="110" cy="22" r="7" fill="#0A1324" opacity="0.85"/>

    <!-- 模拟账目明细条目 -->
    <rect x="28" y="56" width="164" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="28" y="80" width="112" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="28" y="104" width="140" height="10" rx="5" fill="#E2E8F0"/>

    <!-- 虚线分割 -->
    <line x1="28" y1="134" x2="192" y2="134" stroke="#94A3B8" stroke-dasharray="6 6" stroke-width="3"/>

    <!-- 金额数字条 -->
    <rect x="28" y="156" width="70" height="16" rx="6" fill="#94A3B8"/>
    <rect x="130" y="156" width="62" height="16" rx="6" fill="#38BDF8"/>
  </g>

  <!-- 闪电贯穿切角 (象征 AI 与毫秒自动入账) -->
  <g filter="url(#shadowC2)">
    <path d="M 318 174 
             L 214 304 
             L 264 304 
             L 212 408 
             L 340 272 
             L 282 272 Z" 
          fill="url(#boltC2)" 
          stroke="#FFFBEB" 
          stroke-width="5" 
          stroke-linejoin="round"/>
  </g>

  <!-- 闪电冲击波灵动光芒 -->
  <circle cx="212" cy="408" r="7" fill="#FFFFFF"/>
  <circle cx="318" cy="174" r="5" fill="#FFFFFF"/>
</svg>

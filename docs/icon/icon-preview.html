<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>智记 SmartBook —— 图标概念预览</title>
<style>
  body { margin:0; padding:40px 32px; background:#0B0D12; color:#EDF2F7;
         font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#8A94A6; margin:0 0 28px; font-size:13px; }
  .grid { display:flex; gap:24px; flex-wrap:wrap; }
  .card { width:320px; background:#15181F; border:1px solid #232833;
          border-radius:16px; padding:20px; }
  .card img { width:260px; height:260px; display:block; margin:0 auto; }
  .card h2 { font-size:16px; margin:14px 0 6px; }
  .card p { font-size:13px; color:#9AA4B5; line-height:1.6; margin:0; }
  .tag { display:inline-block; font-size:11px; color:#7FE1D5;
         border:1px solid #2A5F58; border-radius:20px; padding:2px 10px; }
</style>
</head>
<body>
  <h1>智记 SmartBook —— 图标概念</h1>
  <p class="sub">三个方向围绕「自动记账」：票据(账单来源) + 闪电(自动) / 账本 + AI 星 + 扫描(采集) / 字母徽章</p>
  <div class="grid">
    <div class="card">
      <img src="icon-a.svg" alt="方案A">
      <h2>方案 A · 闪电票据</h2>
      <p><span class="tag">自动</span>　白票一圈打孔线 = 每笔支付的小票，琥珀闪电 = 通知一到自动入账。直观、记忆点强。</p>
    </div>
    <div class="card">
      <img src="icon-b.svg" alt="方案B">
      <h2>方案 B · 智账本</h2>
      <p><span class="tag">智能</span>　打开的账本 + AI 四角星 + 扫描横线 = AI 替你誊写每一笔。账本意象最贴「记账」。</p>
    </div>
    <div class="card">
      <img src="icon-c.svg" alt="方案C">
      <h2>方案 C · S 徽章</h2>
      <p><span class="tag">字母标</span>　SmartBook 首字母一笔写就，青蓝渐变 + 闪电折角收笔。最简洁、最像现代品牌标。</p>
    </div>
  </div>
</body>
</html>

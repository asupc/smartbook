<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 方案 B：智汇书页 & 金石 (The Smart Ledger & Coin) -->
  <defs>
    <linearGradient id="bgB2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="goldB2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="pageB2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="glowB2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowB2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="124" fill="url(#bgB2)"/>
  <rect width="510" height="510" x="1" y="1" rx="123" fill="none" stroke="#FBBF24" stroke-opacity="0.18" stroke-width="2"/>
  
  <circle cx="256" cy="256" r="190" fill="url(#glowB2)"/>

  <!-- 账本轮廓底托 (展开书卷) -->
  <g>
    <!-- 封底阴影面 -->
    <path d="M 120 180 C 120 156, 170 148, 256 168 C 342 148, 392 156, 392 180 L 392 370 C 392 394, 342 386, 256 406 C 170 386, 120 394, 120 370 Z" 
          fill="#312E81" opacity="0.6"/>
    
    <!-- 展开的书页（左页） -->
    <path d="M 132 170 C 132 150, 180 142, 252 160 L 252 386 C 180 368, 132 376, 132 356 Z" 
          fill="url(#pageB2)" opacity="0.96"/>
    <!-- 左页记账纹理 -->
    <line x1="162" y1="210" x2="222" y2="210" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <line x1="162" y1="246" x2="210" y2="246" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <line x1="162" y1="282" x2="222" y2="282" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>

    <!-- 展开的书页（右页） -->
    <path d="M 260 160 C 332 142, 380 150, 380 170 L 380 356 C 380 376, 332 368, 260 386 Z" 
          fill="url(#pageB2)" opacity="0.96"/>
    <!-- 右页分析纹理 -->
    <line x1="290" y1="210" x2="350" y2="210" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <line x1="290" y1="246" x2="330" y2="246" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <line x1="290" y1="282" x2="350" y2="282" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>

    <!-- 书脊中缝立体暗部 -->
    <rect x="252" y="156" width="8" height="232" fill="#1E1B4B" opacity="0.4"/>
  </g>

  <!-- 中心浮空金色硬币与增长图腾 -->
  <g filter="url(#shadowB2)">
    <circle cx="256" cy="270" r="76" fill="url(#goldB2)"/>
    <circle cx="256" cy="270" r="62" fill="none" stroke="#FEF3C7" stroke-width="4" stroke-opacity="0.8"/>
    <!-- 硬币内上升阶梯折线 -->
    <path d="M 226 294 L 244 274 L 258 284 L 286 244" fill="none" stroke="#78350F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="286,236 294,248 278,248" fill="#78350F"/>
  </g>

  <!-- 右上 AI 荣耀星芒 -->
  <g transform="translate(376, 134)">
    <path d="M 0 -30 Q 0 0 30 0 Q 0 0 0 30 Q 0 0 -30 0 Q 0 0 0 -30 Z" fill="#FDE047"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>
</svg>

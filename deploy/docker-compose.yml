services:
  smartbook-db:
    image: postgres:16-alpine
    container_name: auto-ledger-smartbook-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SMARTBOOK_DB_DATABASE:-smartbook}
      POSTGRES_USER: ${SMARTBOOK_DB_USERNAME:-smartbook}
      POSTGRES_PASSWORD: ${SMARTBOOK_DB_PASSWORD:-CHANGE_ME}
    volumes:
      - smartbook-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMARTBOOK_DB_USERNAME:-smartbook} -d ${SMARTBOOK_DB_DATABASE:-smartbook}"]
      interval: 10s
      timeout: 5s
      retries: 10

  smartbook-cloud:
    image: smartbook-server:latest
    container_name: auto-ledger-smartbook-cloud
    restart: unless-stopped
    depends_on:
      smartbook-db:
        condition: service_healthy
    ports:
      - "${SMARTBOOK_PORT:-8869}:8080"
    environment:
      APP_ENV: production
      API_PREFIX: /api/v1
      WEB_STATIC_DIR: /app/static
      DATABASE_URL: postgresql+psycopg://${SMARTBOOK_DB_USERNAME:-smartbook}:${SMARTBOOK_DB_PASSWORD:-CHANGE_ME}@smartbook-db:5432/${SMARTBOOK_DB_DATABASE:-smartbook}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8869}
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MAX_REQUESTS: 30
      # 附件 / AI 记账截图 / 备份 / rclone 等存储路径全部由镜像 ENV
      # DATA_DIR=/data 派生(见 server/src/config.py),统一落在下面的 volume。
      BACKUP_MAX_UPLOAD_BYTES: 67108864
      ALLOW_APP_RW_SCOPES: "true"
    volumes:
      - smartbook-data:/data

volumes:
  smartbook-db-data:
  smartbook-data:

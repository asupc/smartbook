# server/ 本地开发 compose(单服务,默认 SQLite)。
# - 镜像为**自构建** `smartbook-server`,见 deploy/build_docker.sh;
#   不再使用上游官方镜像(sunxiao0721/beecount-cloud 已脱离)。
# - 正式部署以仓库根目录的 docker-compose.yml 为 canonical
#   (SmartBook-Cloud + PostgreSQL,含卷/健康检查/端口插值),勿在本目录起生产栈。
services:
  smartbook-cloud:
    image: smartbook-server:latest
    restart: unless-stopped
    ports:
      - "8869:8080"
    volumes:
      - ./data:/data
    # 把 server/.env 整份带进容器(开放白名单):src/config.py settings 支持的
    # 环境变量(EMBEDDING_* / AI_* / REGISTRATION_ENABLED / CORS_ORIGINS 等)
    # 在 server/.env 里设置即可生效,无需逐项展开进 environment。
    # 优先级:environment > env_file(显式覆盖保持不变);
    # required: false —— 本地开发没有 server/.env 也能起(默认 SQLite + 默认配置)。
    env_file:
      - path: .env
        required: false
    environment:
      # ===== 必填:JWT secret(改成你自己的 32+ 字节强随机串)=====
      # JWT_SECRET: change-me-please-32-bytes-strong-random

      # ===== AI 文档 Q&A(可选)=====
      # 配了就启用 ⌘K 「问 AI:xxx」(基于 BeeCount-Website 文档做 RAG)。
      # 不配也不影响其它功能 — 用户点「问 AI」时 fallback 到「跳官网搜文档」。
      #
      # 默认走 SiliconFlow + BAAI/bge-m3(免费 quota cover 几十万次问答)。
      # 注册 https://siliconflow.cn 拿 key 填到下面就行。
      #
      # 重要:这里的 EMBEDDING_MODEL 必须跟 BeeCount-Website 索引 build 时一致
      # (向量空间对齐),否则检索结果错乱。docker image 自带的 sqlite 是
      # BAAI/bge-m3 build 的,默认值不要动。
      #
      # 换其它 provider(OpenAI / 智谱 / 阿里 / Ollama 自托管 ...)需要重 build
      # Website 索引,见 .docs/web-cmdk-ai-doc-search.md。
      EMBEDDING_BASE_URL: https://api.siliconflow.cn/v1
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_API_KEY: ""  # ← 填你的 SiliconFlow key 启用 AI 文档 Q&A

      # ===== 汇率代理(多币种 MVP)=====
      # EXCHANGE_RATE_PROXY_ENABLED: "true"
      # EXCHANGE_RATE_CACHE_TTL_HOURS: "12"
      # 可选:整体替换上游为自托管 Frankfurter(http://host:8080)
      # EXCHANGE_RATE_UPSTREAM: ""

      # ===== 其它常用环境变量(详见 docs/DEPLOYMENT.md)=====
      # CORS_ORIGINS: "https://your-domain.com"
      # REGISTRATION_ENABLED: "false"
      # TOTP_ISSUER_NAME: "SmartBook"
      # 本地起反代时,uvicorn(CMD 已开 --proxy-headers)信任 X-Forwarded-For
      # 的来源网段;不设默认只信 127.0.0.1(即忽略外部反代头):
      # FORWARDED_ALLOW_IPS: "172.16.0.0/12"

volumes:
  smartbook_data:

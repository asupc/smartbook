[pytest]
addopts = -q
pythonpath = .

# 批次 X3:Postgres 专有行为的测试标记。
#
# 契约由 Postgres 专有行为承载(advisory lock 串行化、user→ledger 锁序防死锁、
# VARCHAR 列宽越界报错、int8 越界),SQLite in-memory 下不可复现 —— 这些用例
# 标 @pytest.mark.pg_only,默认在 SQLite 环境**跳过**,只有指向真 PG 时才跑。
#
# 用法:
#   python -m pytest tests/ -m "not pg_only"     # 纯 SQLite(本地默认)
#   SMARTBOOK_TEST_DATABASE_URL=postgresql+psycopg://... \
#       python -m pytest tests/                  # 全量(含 pg_only)
#   bash scripts/run_pg_tests.sh                 # 一键起容器 + 跑全量(见该脚本)
markers =
    pg_only: 需要真实 Postgres 后端(dialect=postgresql)才能验证的契约;SQLite 下跳过。
